<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Tips3x3 Odds · Opções</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 420px;
        margin: 1.5rem auto;
        padding: 0 1rem;
        color: #e8eef8;
        background: #0f141c;
      }
      label {
        display: grid;
        gap: 0.35rem;
        margin-bottom: 0.9rem;
        font-size: 0.85rem;
      }
      input[type="url"],
      input[type="text"] {
        padding: 0.5rem 0.65rem;
        border-radius: 8px;
        border: 1px solid #334;
        background: #151b26;
        color: #fff;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }
      button {
        padding: 0.55rem 0.9rem;
        border: 0;
        border-radius: 8px;
        background: #2ecc71;
        color: #04120a;
        font-weight: 700;
        cursor: pointer;
      }
      .hint {
        font-size: 0.78rem;
        color: #9aa6b8;
        line-height: 1.45;
      }
      #status {
        margin-top: 0.75rem;
        font-size: 0.8rem;
        color: #7dff9a;
      }
    </style>
  </head>
  <body>
    <h1>Tips3x3 Odds</h1>
    <p class="hint">
      Capture odds 1X2 da Bet365 e Betnacional (abas logadas) e envie ao painel
      para comparar com a Bolsa.
    </p>

    <label>
      URL do painel
      <input id="apiBase" type="url" placeholder="https://tips3x3.com" />
    </label>

    <label>
      Token de sessão (opcional)
      <input
        id="sessionToken"
        type="text"
        placeholder="Cole tips3x3_session se o cookie não for lido"
      />
    </label>

    <div class="row">
      <input id="enabled" type="checkbox" checked />
      <label for="enabled" style="margin: 0">Captura ativa</label>
    </div>

    <button id="save" type="button">Salvar</button>
    <div id="status"></div>

    <p class="hint" style="margin-top: 1.25rem">
      1) Login em <strong>tips3x3.com</strong><br />
      2) Login e abra futebol em Bet365 + Betnacional<br />
      3) Painel → aba <strong>Comparar</strong>
    </p>
    <script src="options.js"></script>
  </body>
</html>
