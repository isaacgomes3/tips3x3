<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><style>
body{width:350px;margin:0;padding:18px;background:#070a08;color:#f3f6f1;font:14px Arial}h2{margin:0 0 4px;color:#c8ff00}.sub{color:#9aa49b;margin-bottom:14px}.box{background:#111713;border:1px solid #294018;border-radius:12px;padding:13px;margin:10px 0}.row{display:flex;justify-content:space-between;align-items:center;margin:9px 0}input[type=number]{width:86px;background:#080b09;color:white;border:1px solid #49651e;border-radius:7px;padding:7px}button{width:100%;padding:11px;border:0;border-radius:9px;background:#c8ff00;font-weight:bold}.danger{color:#ff7468}.ok{color:#55df8b}small{color:#aab3ab}
</style></head><body><h2 id="title"></h2><div class="sub">Somente Match Odds e Resultado do 1º Tempo</div><div class="box"><div class="row"><b>Execução automática</b><input id="enabled" type="checkbox"></div><div class="row">Pré-live <input id="prelive" type="checkbox"></div><div class="row">Ao vivo até 60' <input id="live" type="checkbox"></div></div><div class="box"><div class="row">Banca por entrada (R$)<input id="budget" type="number" min="3" step="1"></div><div class="row">Comissão (%)<input id="commission" type="number" min="0" max="100" step="0.1"></div><div class="row">ROI mínimo (%)<input id="minRoi" type="number" min="0" step="0.01"></div><small>A entrada é reduzida proporcionalmente quando a liquidez não comporta o valor.</small></div><button id="save">Salvar e verificar agora</button><div class="box" id="status">Carregando...</div><script type="module" src="popup.js"></script></body></html>
