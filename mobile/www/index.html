<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <title>Tips3x3</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #050505;
        color: #d9ff00;
        font-family: system-ui, sans-serif;
      }
      .wrap {
        text-align: center;
        padding: 2rem;
      }
      .pulse {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #5adf8a;
        margin: 1rem auto 0;
        box-shadow: 0 0 12px #5adf8a;
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }
      p {
        color: #8fa392;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <strong>Tips3x3</strong>
      <p>Conectando ao terminal…</p>
      <div class="pulse" aria-hidden="true"></div>
    </div>
  </body>
</html>
