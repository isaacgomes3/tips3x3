<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <title>Tips3x3</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #050505;
        color: #f5f5f5;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      .wrap {
        text-align: center;
        padding: 1.5rem;
        max-width: 18rem;
      }
      .mark {
        display: inline-flex;
        align-items: baseline;
        gap: 0;
        font-size: 1.65rem;
        font-weight: 800;
        font-style: italic;
        letter-spacing: -0.03em;
        line-height: 1;
      }
      .mark span {
        color: #d9ff00;
      }
      .pulse {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #5adf8a;
        margin: 1rem auto 0;
        box-shadow: 0 0 12px #5adf8a;
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }
      p {
        color: #8fa392;
        font-size: 0.82rem;
        line-height: 1.4;
        margin: 0.85rem 0 0;
      }
      button {
        margin-top: 1.1rem;
        appearance: none;
        border: 1px solid rgba(217, 255, 0, 0.35);
        background: #101a12;
        color: #d9ff00;
        padding: 0.65rem 1rem;
        border-radius: 8px;
        font-weight: 600;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark" aria-label="tips3x3">tips<span>3x3</span></div>
      <p id="msg">Abrindo o terminal…</p>
      <div id="pulse" class="pulse" aria-hidden="true"></div>
      <button id="retry" class="hidden" type="button">Tentar de novo</button>
    </div>
    <script>
      (function () {
        var msg = document.getElementById("msg");
        var pulse = document.getElementById("pulse");
        var retry = document.getElementById("retry");
        var target = "https://tips3x3.com/login";

        function showSlow() {
          if (!msg) return;
          msg.textContent =
            "A conexão está demorando. Confira a internet do celular e tente de novo.";
          if (pulse) pulse.classList.add("hidden");
          if (retry) retry.classList.remove("hidden");
        }

        retry &&
          retry.addEventListener("click", function () {
            window.location.href = target + "?t=" + Date.now();
          });

        window.setTimeout(showSlow, 12000);
      })();
    </script>
  </body>
</html>
