<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <title>Tips3x3</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #050505;
        color: #d9ff00;
        font-family: system-ui, sans-serif;
      }
      .wrap {
        text-align: center;
        padding: 2rem;
        max-width: 20rem;
      }
      .pulse {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #5adf8a;
        margin: 1rem auto 0;
        box-shadow: 0 0 12px #5adf8a;
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }
      p {
        color: #8fa392;
        font-size: 0.85rem;
        line-height: 1.4;
      }
      button {
        margin-top: 1.25rem;
        appearance: none;
        border: 1px solid rgba(217, 255, 0, 0.35);
        background: #101a12;
        color: #d9ff00;
        padding: 0.65rem 1rem;
        border-radius: 8px;
        font-weight: 600;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <strong>Tips3x3</strong>
      <p id="msg">Conectando ao terminal…</p>
      <div id="pulse" class="pulse" aria-hidden="true"></div>
      <button id="retry" class="hidden" type="button">Tentar de novo</button>
    </div>
    <script>
      (function () {
        var msg = document.getElementById("msg");
        var pulse = document.getElementById("pulse");
        var retry = document.getElementById("retry");
        var target = "https://tips3x3.com";

        function showSlow() {
          if (!msg) return;
          msg.textContent =
            "A conexão está demorando. Confira a internet do celular e tente de novo.";
          if (pulse) pulse.classList.add("hidden");
          if (retry) retry.classList.remove("hidden");
        }

        retry &&
          retry.addEventListener("click", function () {
            window.location.href = target + "?t=" + Date.now();
          });

        // Se o Capacitor não carregar a URL remota, após 12s mostramos ajuda.
        window.setTimeout(showSlow, 12000);
      })();
    </script>
  </body>
</html>
